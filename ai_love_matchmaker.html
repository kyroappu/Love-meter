<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e83e82">
  <title>AI Love Matchmaker 💘</title>
  <style>
    * { box-sizing: border-box; }
    :root { --pink:#e83e82; --deep:#79234e; --soft:#fff0f6; }
    body {
      margin:0; min-height:100vh; padding:22px 14px; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:var(--deep);
      background:radial-gradient(circle at top left,#ffe1ed,transparent 42%),
                 linear-gradient(145deg,#fff7fa,#ffd8e8);
    }
    .card {
      width:min(100%,480px); background:rgba(255,255,255,.92); border:1px solid white;
      border-radius:28px; padding:26px 22px; box-shadow:0 18px 55px #b82e6822;
    }
    .hero { text-align:center; }
    .heart { font-size:48px; filter:drop-shadow(0 5px 8px #ed8cb655); }
    h1 { margin:8px 0; color:var(--pink); font-size:clamp(27px,7vw,35px); line-height:1.15; }
    .sub { margin:0 auto 22px; color:#98677d; line-height:1.5; max-width:340px; }
    label { display:block; font-weight:750; font-size:14px; margin:14px 0 7px; }
    input {
      width:100%; padding:14px; border:2px solid #f5c5d9; border-radius:14px;
      font:inherit; color:var(--deep); background:#fffafd; outline:none;
    }
    input:focus { border-color:var(--pink); box-shadow:0 0 0 3px #ffe3ee; }
    button {
      border:0; border-radius:14px; padding:14px 18px; font:inherit; font-weight:800;
      cursor:pointer; width:100%; margin-top:18px; color:white;
      background:linear-gradient(100deg,#fa72a7,#df2871); box-shadow:0 8px 18px #e83e8233;
    }
    button:active { transform:scale(.99); }
    .hint { text-align:center; font-size:12px; color:#aa8294; margin:14px 0 0; }
    #result { display:none; margin-top:24px; border-top:1px solid #f8d9e6; padding-top:22px; }
    .match-title { text-align:center; font-weight:800; overflow-wrap:anywhere; }
    .score { font-size:58px; text-align:center; font-weight:900; color:var(--pink); line-height:1.2; margin:8px 0; }
    .bar { font-family:ui-monospace,SFMono-Regular,monospace; font-size:clamp(14px,4vw,18px); text-align:center; letter-spacing:1px; color:#d72d73; overflow-wrap:anywhere; }
    .track { height:13px; background:#ffe1ec; border-radius:30px; overflow:hidden; margin:12px 0 18px; }
    .fill { height:100%; width:0; border-radius:30px; background:linear-gradient(90deg,#ffabc9,#e52c76); transition:width .8s ease; }
    .section { background:#fff5f9; border:1px solid #f9dce8; border-radius:16px; padding:14px; margin-top:12px; }
    .section h2 { font-size:15px; color:var(--pink); margin:0 0 7px; }
    .section p { margin:0; line-height:1.55; font-size:14px; }
    .small { background:#fff0f6; color:#cf2e70; box-shadow:none; border:1px solid #f6c5d9; }
    footer { text-align:center; color:#a77a8e; font-size:11px; line-height:1.5; margin-top:20px; }
  </style>
</head>
<body>
  <main class="card">
    <header class="hero">
      <div class="heart" aria-hidden="true">💘</div>
      <h1>AI Love Matchmaker</h1>
      <p class="sub">A little name magic, a little romance. Discover your playful love match! ✨</p>
    </header>

    <form id="matchForm">
      <label for="userName">Your name</label>
      <input id="userName" name="userName" placeholder="Enter your name here" maxlength="50" required autocomplete="given-name">
      <label for="partnerName">Partner's name</label>
      <input id="partnerName" name="partnerName" placeholder="Enter your partner's name here" maxlength="50" required>
      <button type="submit">Reveal Our Love Score 💞</button>
    </form>

    <section id="result" aria-live="polite">
      <div class="match-title" id="matchTitle"></div>
      <div class="score" id="score">0%</div>
      <div class="bar" id="asciiBar">[░░░░░░░░░░] 0%</div>
      <div class="track" role="progressbar" id="progress" aria-label="Love success percentage" aria-valuemin="0" aria-valuemax="100">
        <div class="fill" id="fill"></div>
      </div>
      <div class="section">
        <h2>🔮 Your romantic reading</h2>
        <p id="reading"></p>
      </div>
      <div class="section">
        <h2>💌 Your relationship secret</h2>
        <p id="tip"></p>
      </div>
      <button class="small" id="again" type="button">Try another pair 💗</button>
    </section>
    <footer>For entertainment only — names can be fun, but real compatibility comes from care, honesty, respect, and communication.</footer>
  </main>

  <script>
    // A playful, repeatable name-matching formula inspired by numerology.
    // It is entertainment, not a scientific prediction of relationship success.
    function calculateLove(nameA, nameB) {
      const normalize = s => s.toLocaleLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '');
      const a = normalize(nameA), b = normalize(nameB);
      const combined = [a, b].sort().join('|');
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        hash = (Math.imul(hash, 31) + combined.charCodeAt(i)) | 0;
      }
      // Add a letter-count flavor to the score, keeping results between 0 and 100.
      const letters = a.length * 7 + b.length * 11 +
        [...a].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) +
        [...b].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return (Math.abs(hash) + letters) % 101;
    }

    function makeBar(score) {
      const filled = Math.round(score / 10);
      return '[' + '█'.repeat(filled) + '░'.repeat(10 - filled) + '] ' + score + '%';
    }

    document.getElementById('matchForm').addEventListener('submit', event => {
      event.preventDefault();
      const a = document.getElementById('userName').value.trim();
      const b = document.getElementById('partnerName').value.trim();
      if (!a || !b) return;
      const score = calculateLove(a, b);
      document.getElementById('matchTitle').textContent = a + ' 💗 ' + b;
      document.getElementById('score').textContent = score + '%';
      document.getElementById('asciiBar').textContent = makeBar(score);
      document.getElementById('progress').setAttribute('aria-valuenow', score);
      document.getElementById('fill').style.width = score + '%';

      let reading;
      if (score >= 90) reading = 'Cosmic-level cuteness! Your name numbers make a very high-scoring pair in this playful match. Keep building trust and making each other laugh. 💍✨';
      else if (score >= 75) reading = 'A bright romantic vibe! Your name numbers suggest a lovely match in our fun formula. Shared adventures and honest conversations can keep the spark glowing. 💖';
      else if (score >= 55) reading = 'Promising potential! Your score brings a sweet, curious energy. Take time to learn what matters to each other and let the connection grow naturally. 🌷';
      else if (score >= 30) reading = 'An intriguing mix! Every pair has its own rhythm, and a number cannot tell the whole story. Find the little things you both enjoy and build from there. 😊';
      else reading = 'A plot twist from the name stars! This score is only a game, not a verdict. Real chemistry can grow through kindness, respect, and getting to know each other. 🌈';

      document.getElementById('reading').textContent = reading;
      document.getElementById('tip').textContent = 'The secret formula is simple: listen without judging, be honest about your feelings, and make time for small thoughtful gestures. A percentage is fun; how you treat each other matters much more. 💌';
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({behavior:'smooth', block:'nearest'});
    });

    document.getElementById('again').addEventListener('click', () => {
      document.getElementById('matchForm').reset();
      document.getElementById('result').style.display = 'none';
      document.getElementById('fill').style.width = '0';
      document.getElementById('userName').focus();
    });
  </script>
</body>
</html>
